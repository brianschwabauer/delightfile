[package]
name = "df-app"
description = "delightfile — a native, GPU-rendered keyboard-first file manager for Wayland."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "delightfile"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
df-core.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
winit.workspace = true
pollster.workspace = true
# Only for `localtime_r`: the mtime/btime linemodes have to be in the machine's
# timezone, and the zoneinfo rules that decide the offset live behind libc.
libc.workspace = true

[lints]
workspace = true
