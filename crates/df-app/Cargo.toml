[package]
name = "df-app"
description = "delightfile — a native, GPU-rendered keyboard-first file manager for Wayland."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "delightfile"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
df-core.workspace = true
crossbeam-channel.workspace = true
# The decode half of PLAN §6's seam. dv-media is already a workspace member and
# already builds; what df-app takes from it is its `ffmpeg` re-export, which is
# how AVIF/HEIF still images decode without a libavif or libheif of our own
# (dv-media itself has no still-image API — see `preview::decode`).
dv-media.workspace = true
# PNG/JPEG/WebP/GIF decoding, the downscale, and the JPEG *encoder* that writes
# a thumbnail back into the shared yazi cache. Already in the workspace and
# already compiled for dv-media; no new dependency enters the tree for it.
image.workspace = true
# The playback half of PLAN §6's seam: the controller thread, the audio
# device and the NV12 frame shader the preview pane draws video with. Already a
# workspace member; it reaches wgpu at the same version egui-wgpu re-exports,
# which is what keeps exactly one wgpu in the build (PLAN §1).
dv-playback.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
winit.workspace = true
pollster.workspace = true
# PDF pages (PLAN §6). The version and the `pdfium_7881` ABI are delightviewer's
# to the digit, so the two programs load the *same* `libpdfium.so` — there is one
# copy of it on this machine and neither program may be the one that needs a
# different build of it.
#
# **No `static` feature**: nothing is linked at build time, the library is
# dlopen'd at runtime, and a machine without it loses PDF pages and nothing else
# (PLAN §6's "missing lib = missing feature, never a failure").
#
# delightviewer also takes `image_025`, which lets it hand `image` buffers to
# pdfium when it *writes* a redacted page. delightfile never writes a PDF, so
# that feature is left off rather than dragging the image crate's default
# codecs into the build through pdfium-render's feature unification.
pdfium-render = { version = "0.9.3", default-features = false, features = [
    "pdfium_7881",
    "thread_safe",
] }
# What a font says about itself, and the glyph outlines the specimen sheet is
# set in (PLAN §6). **Not a new dependency**: epaint already builds this exact
# version, so naming it costs no new compilation.
ttf-parser = "0.25"
# The one thing a 3MF needs that is impractical to rewrite: deflate. Already in
# the build behind the png codec `image` brings, so naming it costs no new
# compilation either — everything else about the zip a 3MF is lives in
# `preview::doc::model`.
miniz_oxide.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# PLAN §7.1's drag out and drop in. `wayland-client` rather than
# `smithay-client-toolkit`: every interface a data-device drag needs is in the
# *core* protocol this crate generates itself, and sctk would add a seat and
# registry framework on top of objects `wayland::State` holds directly. Neither
# is new to the tree — winit builds both — so this is the smaller of two
# already-compiled options, and the protocol-faithful one. The module essay in
# `src/platform/linux/wayland/mod.rs` defends why hand-rolling the wire, the
# house answer everywhere else, is *impossible* here rather than merely harder.
# Linux only: winit builds its own Wayland crates for no other target, so
# anywhere else this would be a second copy of them and a `wayland-client`
# system library to find.
wayland-client.workspace = true
# Only for the Wayland thread's own plumbing — its wake pipe (`pipe2`, `poll`,
# `read`, `write`) and the drag icon's `memfd_create` — so Linux only. The
# local clock the linemodes read is df-core's (`platform::time`).
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The AppKit and Foundation calls behind `src/platform/macos/`, at the versions
# winit already builds (see the workspace manifest). Each feature is a class
# or a header a body here calls into, and nothing else is switched on.
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { workspace = true, features = [
    "NSPasteboard",
    "NSPasteboardItem",
] }

[dev-dependencies]
# The `TempTree` fixture and PLAN §9's gnarly names, shared rather than
# re-typed: the trash and remote views are exercised against real directories,
# and one fixture used on both sides of the split cannot drift from itself.
df-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
