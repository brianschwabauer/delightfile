[package]
name = "df-core"
description = "delightfile's headless half: fs model, sort/filter, op journal + undo, task engine, keymap engine, config. No window, no GPU."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Publish `df_core::test_support` (the `TempTree` fixture and PLAN §9's gnarly
# names) to other crates' tests. Off by default and named as a feature rather
# than a `dev-dependency` trick because that is the only way a *sibling* crate
# can reach a `#[cfg(test)]` module: df-app adds
# `df-core = { workspace = true, features = ["test-support"] }` under
# `[dev-dependencies]` and gets the same fixture the ops tests use.
test-support = []

# Deliberately no winit/egui/wgpu (PLAN §1): everything in here has to be
# unit-testable without a display, and the compile-time proof of that is the
# dependency list staying this short.
[dependencies]
thiserror.workspace = true
log.workspace = true
# Worker threads publish scan results and watch events on channels and ring the
# app's `Wake` bell (PLAN §1). `crossbeam-channel` is already in the tree and is
# the one std::sync::mpsc cannot replace: multi-consumer, so a pool of scan
# workers can share one request queue.
crossbeam-channel.workspace = true
# inotify has no std binding and is four syscalls (PLAN §1's bar for a new
# dependency is "rewriting is impractical"; a watch crate does not clear it).
# The FFI is confined to `fs::inotify`, the crate's only unsafe.
# Also the two syscalls std does not expose elsewhere: the `FICLONE` ioctl
# behind reflink copies (PLAN §5) and `getuid` for the freedesktop trash
# `.Trash-$uid` directory.
libc.workspace = true
# Inflate, for the deflate members of a zip (`archive::unpack`). Already in the
# tree — df-app's PDF reader decompresses object streams with it — and a
# from-scratch inflate is exactly the "rewriting is impractical" the dependency
# rule reserves an exception for. No zlib, no C, no feature flags.
miniz_oxide.workspace = true
# The bulk-rename template's `re` transform (`rename::template`). A regex engine
# is the textbook case of "rewriting is impractical": the parser, the
# automata and the Unicode classes are years of someone else's work, and a
# homemade one would be the slow, subtly wrong version of it. Pure Rust, no
# display, and already in the tree — df-app's `env_logger` compiles this same
# crate — so the build gains a few features rather than a dependency.
regex.workspace = true

[lints]
workspace = true
