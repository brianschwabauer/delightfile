[workspace]
resolver = "2"
members = [
    "crates/dv-core",
    "crates/dv-media",
    "crates/dv-playback",
    "crates/df-core",
    "crates/df-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# GPL because the vendored `dv-*` crates are: they arrived from delightvideo
# through delightviewer under GPL-3.0-or-later and stay under it here.
license = "GPL-3.0-or-later"
repository = "https://github.com/brianschwabauer/delightfile"

[workspace.lints.rust]
unsafe_code = "warn" # dv-media overrides: ffmpeg FFI lives there

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"

[workspace.dependencies]
thiserror = "2"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
libc = "0.2"
# The `wl_data_device` client behind PLAN §7.1's drag out / drop in. **Not a new
# crate in the build**: winit already compiles this exact version, with
# `wayland-backend/client_system`, which is the feature that lets df-app adopt
# winit's own `wl_display` instead of opening a second connection that could
# never start a drag (see `df-app/src/wayland`).
wayland-client = { version = "0.31", features = ["system"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
# `anyhow` and `serde_json` are here only because the vendored `dv-*` crates
# name them; nothing in `df-*` uses either (errors are `thiserror` enums, and
# config parsing is hand-rolled per PLAN §3).
anyhow = "1"
serde_json = "1"

# The headless half: fs model, sort/filter, op journal, task engine, keymap,
# config. No winit/egui/wgpu, so it is testable without a window (PLAN §1).
df-core = { path = "crates/df-core" }

# Vendored from delightviewer (which vendored them from delightvideo), copied
# unchanged so this repo builds standalone. `default-features = false` on
# dv-media drops whisper.cpp — a file manager never transcribes.
dv-media = { path = "crates/dv-media", default-features = false }
dv-playback = { path = "crates/dv-playback" }
dv-core = { path = "crates/dv-core" }

# Version lockstep with delightviewer, so the two programs can share vendored
# code and a thumbnail cache without a second wgpu in the tree. wgpu is reached
# only through `egui_wgpu::wgpu`, never as a direct dependency (PLAN §1).
egui = "0.35.0"
egui-wgpu = "0.35.0"
# Without `clipboard` and `links`. `clipboard` is a second clipboard (arboard,
# and smithay-clipboard's worker thread on Wayland) that reads the system's on
# egui's own paste chord, an event df-app never consumes — its clipboard is
# its own, through the desktop device and `crate::clipboard` — and whose
# thread the window's exit had to outlive. `links` opens URLs through
# webbrowser, which df-app never asks egui to do.
egui-winit = { version = "0.35.0", default-features = false, features = [
    "wayland",
    "x11",
] }
winit = "0.30.13"
# macOS only: AppKit and Foundation, for df-app's `platform/macos` bodies (the
# pasteboard, drag-out, volumes, the appearance). **Not new crates in the
# build**: these are the versions winit 0.30.13 compiles on macOS, so naming
# them costs only the few extra classes each crate's features switch on
# (plans/other-platforms/00-ground-rules.md §3). Cargo.lock also holds objc2
# 0.6 and objc2-foundation 0.3 through wgpu and cpal; those are not these.
objc2 = "0.5.2"
objc2-foundation = "0.2.2"
objc2-app-kit = "0.2.2"
pollster = "1.0.1"
miniz_oxide = "0.8"
# The bulk-rename template's `re` transform (df-core `rename::template`). No
# default features: `std` plus the two Unicode tables a filename pattern
# actually reaches for — `\d`/`\w`/`\s` and `(?i)` — and none of the
# rest. df-app's `env_logger` already builds this crate with `perf` on top.
regex = { version = "1", default-features = false, features = [
    "std",
    "unicode-perl",
    "unicode-case",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }

[profile.dev]
opt-level = 1 # egui/wgpu are unusable at opt-level 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
